[behave]
default_tags = @Test
format = rerun
outfiles = rerun_failing.features
logging_level = INFO
log_capture = false
stderr_capture = false
stdout_capture = false
show_skipped = false

[behave.formatters]
allure = allure_behave.formatter:AllureFormatter

